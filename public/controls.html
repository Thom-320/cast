<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Cast - Mobile Remote Controls</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/spot.css" />
    <style>
      .page {
        max-width: 480px;
        min-height: 100vh;
        gap: var(--space-4);
        padding-top: var(--space-4);
        padding-bottom: var(--space-4);
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--space-3);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
      }
      .status[data-status="connecting"] .dot {
        animation: blink 1s steps(2, start) infinite;
      }
      .status[data-status="connected"] .dot {
        background: var(--ink);
      }
      .status[data-status="disconnected"] .dot,
      .status[data-status="noprojector"] .dot,
      .status[data-status="error"] .dot {
        background: var(--accent);
        border-color: var(--accent);
      }
      @keyframes blink {
        to { visibility: hidden; }
      }
      .counter {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
      }
      .counter__total {
        font-size: 22px;
        line-height: 30px;
        font-weight: 600;
      }
      .remote {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      #nextBtn {
        flex-grow: 1;
        min-height: 160px;
        font-size: 22px;
        line-height: 30px;
      }
      #prevBtn {
        min-height: 96px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <h1 class="spot-hero spot-hero--3">cast</h1>
        <span class="status" id="connectionStatus" data-status="connecting">
          <span class="dot"></span>
          <span class="spot-label" id="statusText">Connecting</span>
        </span>
      </header>

      <div class="spot-frame">
        <div class="spot-frame__in"></div>
        <span class="spot-label">Slide</span>
        <p class="counter">
          <span id="currentSlide" class="spot-hero spot-hero--2">1</span>
          <span class="counter__total">/ <span id="totalSlides">?</span></span>
        </p>
      </div>

      <section class="remote">
        <button
          id="nextBtn"
          class="spot-button spot-button--solid spot-button--block"
          type="button"
        >
          Next →
        </button>
        <button
          id="prevBtn"
          class="spot-button spot-button--block"
          type="button"
        >
          ← Previous
        </button>
      </section>

      <footer style="display: flex; flex-direction: column; gap: var(--space-3)">
        <button
          class="spot-button spot-button--block"
          type="button"
          id="stopBtn"
        >
          ■ Leave Remote
        </button>
        <p class="meta" id="presence" aria-live="polite"></p>
        <p class="meta">Presentation by {{USERNAME}}</p>
      </footer>
    </main>
    <script>
      (function () {
        const castCode = "{{CAST_CODE}}";
        const configured = "{{WS_URL}}";
        const params = new URLSearchParams(location.search);
        const who = (params.get("quien") || params.get("who") || "").slice(0, 24);

        function relayBase() {
          if (configured && !configured.startsWith("{{")) return configured.replace(/\?.*$/, "");
          const proto = location.protocol === "https:" ? "wss://" : "ws://";
          // Served straight from the Gleam port: the relay listens next to it on 8080.
          const host = location.port === "6767" ? location.hostname + ":8080" : location.host;
          return proto + host + "/ws/";
        }
        const WS_URL =
          relayBase() + "?cast_code=" + encodeURIComponent(castCode) + "&type=controller" +
          (who ? "&quien=" + encodeURIComponent(who) : "");

        const statusLabels = {
          connecting: "Connecting",
          connected: "Connected",
          disconnected: "Reconnecting",
          noprojector: "Projector offline",
        };

        let socket = null;
        let lastHeard = 0;
        let retry = 0;
        let projector = "none";
        const pending = new Map(); // id -> {msg, sent}

        function updateConnectionStatus(status) {
          document.getElementById("connectionStatus").dataset.status = status;
          document.getElementById("statusText").textContent = statusLabels[status];
          const disabled = status === "connecting" || status === "disconnected";
          document.getElementById("nextBtn").disabled = disabled;
          document.getElementById("prevBtn").disabled = disabled;
        }
        function showLinkState() {
          if (!socket || socket.readyState !== WebSocket.OPEN) return;
          updateConnectionStatus(projector === "none" ? "noprojector" : "connected");
        }
        function presenceText(p) {
          const others = p.controllers.filter(Boolean);
          const screens = p.presentations === 1 ? "1 screen" : p.presentations + " screens";
          const remotes = others.length === 1 ? "1 remote" : others.length + " remotes";
          return (p.projector === "none" ? "No projector connected" : screens) + " · " + remotes;
        }

        function connect() {
          updateConnectionStatus("connecting");
          const ws = new WebSocket(WS_URL);
          socket = ws;

          ws.onopen = () => {
            retry = 0;
            lastHeard = Date.now();
            showLinkState();
            // Commands that never got an ack are resent with the same id:
            // the relay drops repeats, so a retry can never advance twice.
            const now = Date.now();
            for (const [id, p] of pending) {
              if (now - p.sent > 8000) pending.delete(id);
              else ws.send(JSON.stringify(p.msg));
            }
          };

          ws.onmessage = (event) => {
            lastHeard = Date.now();
            let data;
            try { data = JSON.parse(event.data); } catch { return; }
            if (data.type === "state") {
              document.getElementById("currentSlide").textContent = data.indexh + 1;
              document.getElementById("totalSlides").textContent = data.total || "?";
            } else if (data.type === "presence") {
              projector = data.projector;
              document.getElementById("presence").textContent = presenceText(data);
              showLinkState();
            } else if (data.type === "ack") {
              pending.delete(data.id);
              if (!data.delivered) document.getElementById("presence").textContent =
                "Not sent: no projector connected";
            }
          };

          ws.onclose = () => {
            if (socket !== ws) return;
            updateConnectionStatus("disconnected");
            const wait = Math.min(10000, 1000 * 2 ** retry++) * (0.75 + Math.random() / 2);
            setTimeout(connect, wait);
          };
          ws.onerror = () => {};
        }

        // The relay speaks every 20 s; 45 s of silence means a dead link.
        setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN && Date.now() - lastHeard > 45000) socket.close();
        }, 5000);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState !== "visible") return;
          if (socket && socket.readyState === WebSocket.OPEN) socket.send('{"type":"hb"}');
          else if (!socket || socket.readyState === WebSocket.CLOSED) connect();
        });

        function sendCommand(action) {
          const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
          const msg = { type: "cmd", action, id };
          pending.set(id, { msg, sent: Date.now() });
          if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(msg));
          if (navigator.vibrate) navigator.vibrate(15);
        }

        document.getElementById("nextBtn").addEventListener("click", () => sendCommand("next"));
        document.getElementById("prevBtn").addEventListener("click", () => sendCommand("prev"));
        document.addEventListener("keydown", (e) => {
          if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); sendCommand("next"); }
          if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); sendCommand("prev"); }
        });
        document.getElementById("stopBtn").addEventListener("click", () => {
          if (confirm("Leave the remote?")) {
            if (socket) socket.close();
            window.location.href = "/";
          }
        });

        connect();
      })();
    </script>
  </body>
</html>
